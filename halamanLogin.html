    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PC Parts Store</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

       body {
            background-color: aliceblue; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
        }

        h2 {
            color: black;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: gray;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: dimgray; 
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid silver; 
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        } 
                input:focus {
            background-color: lightcyan; 
            border-color: deepskyblue;
        }
        .btn-masuk {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: steelblue; 
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-masuk:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Pc parts store</h2>
    <p class="subtitle">Masuk kalau mau lihat komponen
    </p>
    <form>
        <div class="input-grup">
            <label for="username">Username</label>
            <input type="text" id="username"placeholder="Nama pengguna" required>
        </div>
        <div class="input-grup">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Kata sandi"required>
        </div>
<a href="indexBaru.html" id="password" class="btn-masuk">Masukc
    </form>

</div>
</html>

</body>
</html>
